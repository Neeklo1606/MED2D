name: Deploy staging (med.neeklo.ru)
# Секреты репозитория (Settings -> Secrets and variables -> Actions):
#   STAGING_SSH_HOST  = 31.192.111.33
#   STAGING_SSH_USER  = пользователь с sudo (или root)
#   STAGING_SSH_KEY   = приватный SSH-ключ этого пользователя
#   STAGING_SSH_PORT  = необязательно, по умолчанию 22
# Без секретов job пропускается.
# Образ собирается здесь и передаётся на сервер файлом: серверу не нужен
# доступ к Docker Hub и npm (из РФ они могут быть недоступны).
on:
  push:
    branches: [main, claude/festive-clarke-rnf8vy]
    # документы, скриншоты и диагностика не перезапускают сайт
    paths-ignore:
      - "docs/**"
      - "artifacts/**"
      - "tools/**"
      - "**/*.md"
      - ".github/workflows/diag-server.yml"
      - ".github/workflows/check-server.yml"
  workflow_dispatch:
concurrency: deploy-staging
permissions:
  contents: write   # загрузка образа в служебный релиз staging-build
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.STAGING_SSH_KEY != '' && secrets.STAGING_SSH_HOST != '' }}
    steps:
      - name: Skip without secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY are not set, deploy skipped"
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - name: Build image and publish to release staging-build
        if: env.HAS_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker build -t medform-app .
          docker save medform-app | gzip > medform-app.tar.gz
          ls -lh medform-app.tar.gz
          # Загрузка на сервер из-за рубежа медленная, а скачивание с сервера быстрое:
          # кладём образ в релиз, сервер скачивает его сам.
          gh release view staging-build >/dev/null 2>&1 || gh release create staging-build --prerelease --title "Staging build (служебный)" --notes "Образ для автодеплоя med.neeklo.ru. Обновляется на каждый деплой."
          gh release upload staging-build medform-app.tar.gz --clobber
          mkdir -p bundle/deploy
          cp docker-compose.yml .env.example bundle/
          cp deploy/* bundle/deploy/
      - name: Prepare target dir
        if: env.HAS_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            S=""; [ "$(id -u)" -ne 0 ] && S="sudo"
            $S mkdir -p /opt/medform && $S chown "$(id -u):$(id -g)" /opt/medform
      - name: Upload bundle
        if: env.HAS_SECRETS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: "bundle/*"
          timeout: 60s
          command_timeout: 15m
          target: /opt/medform
          strip_components: 1
      - name: Bootstrap and start
        if: env.HAS_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            curl -fL --retry 3 --retry-delay 5 -o /opt/medform/medform-app.tar.gz "https://github.com/${{ github.repository }}/releases/download/staging-build/medform-app.tar.gz"
            ls -lh /opt/medform/medform-app.tar.gz
            APP_VERSION=${{ github.sha }} APP_PORT=${{ secrets.APP_PORT || 3010 }} bash /opt/medform/deploy/bootstrap.sh
      - name: Smoke from outside
        if: env.HAS_SECRETS == 'true'
        run: |
          curl -fsS https://med.neeklo.ru/api/health
          curl -sI https://med.neeklo.ru | grep -i x-robots-tag
