# На сервере 31.192.111.33 уже работает nginx (ответ neeklo.ru: server: nginx),
# поэтому для стейджа используем его, а не отдельный Caddy. См. docs/deploy.md
server {
    listen 80;
    server_name med.neeklo.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name med.neeklo.ru;

    ssl_certificate     /etc/letsencrypt/live/med.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/med.neeklo.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # убрать при INDEXING_ENABLED=true

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 20m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
